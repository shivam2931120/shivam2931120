<svg xmlns="http://www.w3.org/2000/svg" width="760" height="112" viewBox="0 0 760 112" role="img" aria-label="Rotating developer quote">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.q1{animation:q 12s infinite}.q2{animation:q 12s 6s infinite;opacity:0}@keyframes q{0%,45%{opacity:1}50%,95%,100%{opacity:0}}</style><rect width="760" height="112" rx="16" fill="#0b1118" stroke="#263645"/><text x="28" y="29" fill="#ff7b72" font-size="12">// RANDOM TRANSMISSION</text><g class="q1"><text x="28" y="63" fill="#dbe7f3" font-size="15">“Good systems make hard things feel ordinary.”</text><text x="28" y="88" fill="#8ab4ff" font-size="11">— Backend philosophy</text></g><g class="q2"><text x="28" y="63" fill="#dbe7f3" font-size="15">“The best interface is the one that gets out of the way.”</text><text x="28" y="88" fill="#8ab4ff" font-size="11">— Golden rule of shipping</text></g></svg>